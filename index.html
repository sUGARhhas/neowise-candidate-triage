<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #result { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="result" role="status" aria-live="polite"></p>
  <script type="module">
    const form = document.querySelector("form");
    const result = document.querySelector("#result");
    const message = document.querySelector("#message");
    const topics = new Map([["delivery", "Доставка"], ["pricing", "Стоимость"], ["other", "Другое"]]);
    const manualReview = "Нужен ручной разбор. Проверьте текст заявки и подготовьте ответ самостоятельно.";
    let revision = 0;

    message.addEventListener("input", () => {
      revision++;
      result.textContent = "";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const current = ++revision;
      const text = message.value.trim();
      if (!text) {
        result.textContent = "Введите текст заявки.";
        message.focus();
        return;
      }

      result.textContent = "Разбираем заявку…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await reply.json();
        if (current !== revision) return;
        if (reply.status === 400 && data?.status === "invalid_input") {
          result.textContent = "Введите текст заявки.";
        } else if (reply.ok && data?.status === "ready" && topics.has(data.topic)
                   && typeof data.draft === "string" && data.draft.trim()) {
          result.textContent = `Тема: ${topics.get(data.topic)}\nЧерновик: ${data.draft.trim()}`;
        } else {
          result.textContent = manualReview;
        }
      } catch {
        if (current === revision) result.textContent = manualReview;
      }
    });
  </script>
</body>
</html>
